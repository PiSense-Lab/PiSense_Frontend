name: Deploy Main Branch on Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: PiSense-Runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync files to production directory
        run: |
          rsync -av --delete --exclude='node_modules' $GITHUB_WORKSPACE/ /home/pisense/frontend/PiSense_Frontend/

      - name: Install npm dependencies
        working-directory: /home/pisense/frontend/PiSense_Frontend
        run: |
          npm install

      - name: Restart frontend service
        run: |
          sudo systemctl restart pisense-frontend
